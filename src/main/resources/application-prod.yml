spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_COMMAND_TIMEOUT:3s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
    min-response-size: 2KB
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${HTTP_KEEP_ALIVE_TIMEOUT:20s}
    max-connections: ${HTTP_MAX_CONNECTIONS:8192}
    accept-count: ${HTTP_ACCEPT_COUNT:100}
    threads:
      max: ${HTTP_MAX_THREADS:200}
      min-spare: ${HTTP_MIN_SPARE_THREADS:10}

management:
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

app:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    refresh-cookie-secure: true
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_MEDIA_BUCKET}

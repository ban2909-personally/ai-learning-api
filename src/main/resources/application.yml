spring:
  application:
    name: ai-learning-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ai_learning}
    username: ${DB_USERNAME:ai_learning}
    password: ${DB_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${LEARNING_EVENTS_KAFKA_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${LEARNING_EVENTS_KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${LEARNING_EVENTS_KAFKA_MAX_BLOCK_MS:10000}
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  catalog:
    cache:
      popular:
        key-prefix: ${POPULAR_CATALOG_CACHE_KEY_PREFIX:catalog:popular:v1}
        ttl: ${POPULAR_CATALOG_CACHE_TTL:PT5M}
  security:
    jwt-secret: ${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktcmVwbGFjZS10aGlzLXNlY3JldC1iZWZvcmUtcHJvZHVjdGlvbg==}
    issuer: ${JWT_ISSUER:ai-learning-api}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  media:
    max-upload-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}
    allowed-content-types:
      - video/mp4
      - video/webm
  messaging:
    learning-events:
      enabled: ${LEARNING_EVENTS_KAFKA_ENABLED:false}
      topic: ${LESSON_COMPLETED_TOPIC:ai-learning.learning.lesson-completed.v1}
      batch-size: ${LEARNING_EVENTS_BATCH_SIZE:10}
      poll-delay: ${LEARNING_EVENTS_POLL_DELAY:PT1S}
      claim-lease: ${LEARNING_EVENTS_CLAIM_LEASE:PT5M}
      send-timeout: ${LEARNING_EVENTS_SEND_TIMEOUT:PT10S}
      producer-max-block-ms: ${LEARNING_EVENTS_KAFKA_MAX_BLOCK_MS:10000}
      retry-initial: ${LEARNING_EVENTS_RETRY_INITIAL:PT2S}
      retry-max: ${LEARNING_EVENTS_RETRY_MAX:PT5M}
  notifications:
    consumer:
      enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
      topic: ${LESSON_COMPLETED_TOPIC:ai-learning.learning.lesson-completed.v1}
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:ai-learning-notifications-v1}
      retry-delay: ${NOTIFICATION_KAFKA_RETRY_DELAY:PT10S}
    websocket:
      message-size: ${NOTIFICATION_WS_MESSAGE_SIZE:16KB}
      send-time-limit: ${NOTIFICATION_WS_SEND_TIME_LIMIT:PT10S}
      send-buffer-size: ${NOTIFICATION_WS_SEND_BUFFER_SIZE:512KB}
      first-message-timeout: ${NOTIFICATION_WS_FIRST_MESSAGE_TIMEOUT:PT30S}
      heartbeat: ${NOTIFICATION_WS_HEARTBEAT:PT10S}
  analytics:
    consumer:
      enabled: ${ANALYTICS_KAFKA_ENABLED:false}
      topic: ${LESSON_COMPLETED_TOPIC:ai-learning.learning.lesson-completed.v1}
      group-id: ${ANALYTICS_KAFKA_GROUP_ID:ai-learning-analytics-v1}
      retry-delay: ${ANALYTICS_KAFKA_RETRY_DELAY:PT10S}
  ai:
    mentor:
      quota:
        key-prefix: ${MENTOR_QUOTA_KEY_PREFIX:mentor:quota:v1}
        requests: ${MENTOR_QUOTA_REQUESTS:20}
        window: ${MENTOR_QUOTA_WINDOW:PT1H}
      web:
        stream-timeout: ${MENTOR_STREAM_TIMEOUT:PT2M}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-mini}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1500}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${OPENAI_READ_TIMEOUT:PT90S}
      call-timeout: ${OPENAI_CALL_TIMEOUT:PT100S}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin_local_password}
      bucket: ${MINIO_MEDIA_BUCKET:lesson-media}

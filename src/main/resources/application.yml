spring:
  application:
    name: ai-learning-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ai_learning}
    username: ${DB_USERNAME:ai_learning}
    password: ${DB_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  catalog:
    cache:
      popular:
        key-prefix: ${POPULAR_CATALOG_CACHE_KEY_PREFIX:catalog:popular:v1}
        ttl: ${POPULAR_CATALOG_CACHE_TTL:PT5M}
  security:
    jwt-secret: ${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktcmVwbGFjZS10aGlzLXNlY3JldC1iZWZvcmUtcHJvZHVjdGlvbg==}
    issuer: ${JWT_ISSUER:ai-learning-api}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  media:
    max-upload-size: ${MEDIA_MAX_UPLOAD_SIZE:2GB}
    allowed-content-types:
      - video/mp4
      - video/webm
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin_local_password}
      bucket: ${MINIO_MEDIA_BUCKET:lesson-media}
